<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Valentine</title>

<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <button id="themeBtn" title="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>

  <div class="hearts"></div>
  <div class="petals"></div>

  <div class="container">
    <h1 id="typewriter"></h1>

    <img src="assets/cat.png" class="cat" alt="Cute Cat" />

    <div class="card">
      <p>Every love story is beautiful, but ours is my favorite. 💕</p>
      <div class="btn-row">
        <button id="yesBtn">Yes ❤️</button>
        <button id="noBtn">No</button>
      </div>
    </div>

    <footer>Click anywhere to start the music 🎵</footer>
  </div>

  <div id="popup">
    <div class="popup-box">
      <button id="closePopup">&times;</button>
      <img src="assets/yes.gif" class="successGif" alt="Celebration" />
      <center>
        <h2>Yay! 🎉</h2>
        <h2>Lydia Sharon</h2>
        <p>You just made me the happiest person alive. I love you! ❤️</p>
      </center>
    </div>
  </div>

  <!-- Replace src below with your own audio file in the assets folder -->
  <audio id="music" loop>
    <source src="assets/your-song.mpeg" type="audio/mpeg" />
  </audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
